# render.yaml
services:
  - type: web
    name: apistosos-api            
    env: python
    plan: free                    
    region: oregon                 
    buildCommand: "pip install -r app/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:                       
      - key: MODEL_PATH
        value: model/modelo_entrenado.pkl
